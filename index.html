<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FMath: Kalkulator biaya dan profit untuk trader fomo</title>
    <meta name="description" content="Kalkulator independen untuk trader fomo: biaya trade per chain, titik impas, profit bersih, dan perps dengan harga likuidasi. Data pasar live dari DexScreener dan Hyperliquid." />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FMath: Kalkulator biaya dan profit untuk trader fomo" />
    <meta property="og:description" content="Hitung biaya trade, titik impas, dan profit bersih untuk spot dan perps di fomo." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link rel="preconnect" href="https://api.dexscreener.com" crossorigin />
    <link rel="preconnect" href="https://api.hyperliquid.xyz" crossorigin />
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('fmath:theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>FMath membutuhkan JavaScript untuk menghitung. / FMath needs JavaScript to calculate.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
